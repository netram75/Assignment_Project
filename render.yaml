services:
  - type: web
    name: pdf-agent
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PORT
        value: 8000
      - key: LOG_LEVEL
        value: INFO
